name: Refresh news

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: published-snapshot-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test collectors
        run: python -m unittest discover -s tests -v
      - name: Refresh public news metadata
        env:
          NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scripts/pipeline.py news
      - name: Validate JSON
        run: python scripts/validate_snapshot.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- public/data/snapshot.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_snapshot.py news
