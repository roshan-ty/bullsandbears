name: Refresh core fundamentals

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: published-snapshot-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Refresh and score data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CALENDAR_API_URL: ${{ secrets.CALENDAR_API_URL }}
          CALENDAR_API_KEY: ${{ secrets.CALENDAR_API_KEY }}
        run: python scripts/pipeline.py core
      - name: Validate JSON
        run: python scripts/validate_snapshot.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- public/data/snapshot.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json
          git commit -m "data: refresh core fundamentals"
          git push
